services:
  db:
    image: postgres:17-alpine
    container_name: prueba_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fleetcore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      retries: 5

  api:
    build: .
    container_name: fleetcore_api
    restart: unless-stopped
    env_file: .env
    # Inside the Docker network the API reaches Postgres by service name and internal port.
    # PORT is fixed to 3000 inside the container; the host side of "ports" uses the .env PORT
    # Dentro de la red de Docker la API llega a Postgres por el nombre del servicio y el puerto interno.
    # PORT queda fijo en 3000 dentro del contenedor; el lado del host en "ports" usa el PORT del .env
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fleetcore-net

  db_test:
    image: postgres:17-alpine
    container_name: prueba_db_test
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: prueba_db_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d prueba_db_test"]
      interval: 2s
      retries: 15

volumes:
  pgdata:

networks:
  fleetcore-net:
